# TODO Extract fragment for Vehicle and use it in both query and subscription
subscription VehiclesSubscription(
    $serviceJourneyId: String!
) {
    vehicles(serviceJourneyId: $serviceJourneyId) {
        bearing
        delay
        destinationName
        expirationEpochSecond
        inCongestion
        lastUpdatedEpochSecond
        line {
            lineRef
            lineName
            publicCode
        }
        location {
            latitude
            longitude
        }
        mode
        monitored
        monitoredCall {
            order
            stopPointRef
            vehicleAtStop
        }
        occupancyStatus
        originName
        progressBetweenStops {
            percentage
            linkDistance
        }
        serviceJourney {
            id
        }
        speed
        vehicleId
        vehicleStatus
    }
}

query VehiclesQuery(
    $serviceJourneyId: String!
) {
    vehicles(serviceJourneyId: $serviceJourneyId) {
        bearing
        delay
        destinationName
        expirationEpochSecond
        inCongestion
        lastUpdatedEpochSecond
        line {
            lineRef
            lineName
            publicCode
        }
        location {
            latitude
            longitude
        }
        mode
        monitored
        monitoredCall {
            order
            stopPointRef
            vehicleAtStop
        }
        occupancyStatus
        originName
        progressBetweenStops {
            percentage
            linkDistance
        }
        serviceJourney {
            id
        }
        speed
        vehicleId
        vehicleStatus
    }
}
